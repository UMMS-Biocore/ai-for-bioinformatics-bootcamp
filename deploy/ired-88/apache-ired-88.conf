# Live IRED-88 demo at https://biocore.umassmed.edu/ired-88/live/
#
# Append to /etc/httpd/conf.d/bootcamp.conf (next to the next-token block),
# then: apachectl configtest && systemctl reload httpd
#
# Needs mod_proxy_http and mod_proxy_wstunnel (both loaded on umwlresdol02):
# marimo talks to the browser over a websocket.
#
# Unlike next-token, the prefix is NOT stripped: the container runs marimo
# with --base-url /ired-88/live, so the path passes through unchanged.
# /ired-88/ itself stays the static snapshot served from the document root.

<IfDefine !IRED88_UPSTREAM>
    Define IRED88_UPSTREAM http://127.0.0.1:8011
</IfDefine>

RedirectMatch 301 ^/ired-88/live$ /ired-88/live/

<Location "/ired-88/live/">
    # upgrade=websocket hands the marimo websocket to mod_proxy_wstunnel.
    # retry=0: do not mark the backend dead for 60s after a container restart.
    ProxyPass        "${IRED88_UPSTREAM}/ired-88/live/" upgrade=websocket retry=0 timeout=300
    ProxyPassReverse "${IRED88_UPSTREAM}/ired-88/live/"
</Location>
