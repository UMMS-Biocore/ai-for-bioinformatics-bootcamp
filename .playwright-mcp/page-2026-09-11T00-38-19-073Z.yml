        - heading "A language model is a very well-read autocomplete" [level=2] [ref=e58]
        - paragraph [ref=e59]: Everything you'll see this fall, from code that writes itself to summaries of a thousand papers, rests on one core mechanism. The model looks at the text so far and predicts what comes next. It reads and writes one chunk at a time, over and over.
        - paragraph [ref=e60]: That sounds too small to matter. The surprise of the last few years is what the trick looks like when you do it extremely well, over more text than any person could read in a hundred lifetimes. My goal is that you leave able to trace any answer a model gives you back to this one mechanism.
