        - heading "How language models actually work" [level=1] [ref=e53]
        - paragraph [ref=e54]: "I'll spend this session on one trick: predicting the next token, over a library of text bigger than any lifetime of reading. By the end you can explain the trick to your own lab, and you know where it breaks."
        - paragraph [ref=e55]: The toy model behind every demo you'll see is a real language model, just a very small one. It read four short paragraphs of biology text and counted which letters follow which. Nothing here is faked, which is exactly the point.
      - generic [ref=e56]:
