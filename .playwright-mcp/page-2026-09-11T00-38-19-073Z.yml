        - paragraph [ref=e74]: "Before a model can predict anything, it has to read. Models read in chunks called tokens. A token is a common cluster of characters: everyday words get their own token, rarer words get split into pieces. By the time text reaches the model, it has become a list of numbers, one ID per token, and that list is the model's entire view of everything you typed."
