        - paragraph [ref=e108]: The model's probabilities come from training. During training, the model makes a guess at every position in the text, compares its guess with what the text actually says next, and nudges itself a little toward the truth. Billions of nudges later, the patterns of the library live in the model's parameters, the stored numbers training adjusts.
