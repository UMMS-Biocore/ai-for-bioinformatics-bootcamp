          - paragraph [ref=e1192]: "The frame I find most useful: treat the model as a collaborator. Collaborators do brilliant work, make honest mistakes, and expect their work to be checked. The mistake you catch is the one you looked at."
        - generic [ref=e1193]:
          - generic [ref=e1194]: The short version
          - paragraph [ref=e1195]: A language model predicts the next token over a library bigger than anyone could read in a lifetime, so fluent answers come from interpolating within that library's patterns. They land outside the truth when the most plausible continuation happens to be false, because nothing in the mechanism checks truth.
        - paragraph [ref=e1196]: "Part B, led by Alper, turns the habits in that table into concrete rules: protecting patient data, verification discipline, disclosure, reproducibility, and the cases where you leave the model out of it entirely. He has war stories, and they're worth staying for."
      - generic [ref=e1197]:
        - paragraph [ref=e1198]: Appendix
        - heading "Take it with you" [level=2] [ref=e1199]
        - paragraph [ref=e1200]: Every session is recorded, so nothing here depends on having been in the room. Here is the vocabulary in one place, the questions we expect in the room, and where to go deeper if you want more.
        - heading "The vocabulary" [level=3] [ref=e1201]
        - generic [ref=e1202]:
          - term [ref=e1203]: "Token:"
          - definition [ref=e1204]: "The chunk of text a model reads: a word, a piece of a word, or a punctuation mark, mapped to an ID number."
          - term [ref=e1205]: "Next-token prediction:"
          - definition [ref=e1206]: "The whole trick: look at the text so far, assign a probability to every possible next token."
          - term [ref=e1207]: "Probability distribution:"
          - definition [ref=e1208]: The full list of probabilities the model assigns, one for each possible next token. The model's answer to every question is one of these lists.
          - term [ref=e1209]: "Sampling:"
          - definition [ref=e1210]: "Rolling the weighted die: picking one token from the distribution. This is why answers vary."
          - term [ref=e1211]: "Temperature:"
          - definition [ref=e1212]: The knob that reshapes the distribution before the roll. Low is cautious, high is adventurous. Set explicitly in API use, hidden in consumer apps.
          - term [ref=e1213]: "Parameters:"
          - definition [ref=e1214]: The stored numbers inside the model; training adjusts them and every answer runs through them, so scale just means more of them.
          - term [ref=e1215]: "Training:"
          - definition [ref=e1216]: "The expensive loop: guess the next token everywhere in the library, compare with reality, nudge the parameters."
          - term [ref=e1217]: "Inference:"
          - definition [ref=e1218]: Using the trained model to answer. Cheap compared with training; this is what happens when you chat.
          - term [ref=e1219]: "Training distribution:"
          - definition [ref=e1220]: The shape of everything the model read. The model mimics it, so it can only be as current and fair as its library.
          - term [ref=e1221]: "Interpolation:"
          - definition [ref=e1222]: Landing inside the cloud of patterns the model has seen. The right default picture for how it answers; it retrieves nothing.
          - term [ref=e1223]: "Hallucination:"
          - definition [ref=e1224]: The same mechanism, fluently wrong. A plausible continuation that happens to be false.
          - term [ref=e1225]: "Fine-tuning:"
          - definition [ref=e1226]: Extra training on your own data to specialize a pretrained model.
          - term [ref=e1227]: "Foundation model:"
          - definition [ref=e1228]: "One model, trained on broad data at scale, adapted to many jobs: text, protein structure, gene expression, regulation."
